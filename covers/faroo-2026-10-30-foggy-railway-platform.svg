<path d="M488 269H520L516 287H492Z" fill="#ffdda4"/>
<path d="M634 311H650L648 322H636Z" fill="#ffdda4"/></g>
<!-- Old wooden bench, with a suitcase: focal still life -->
<ellipse cx="260" cy="667" rx="240" ry="32" fill="#0d1728" opacity=".54" filter="url(#blur)"/>
<g transform="translate(82 450)">
<path d="M15 78L264 55L267 76L17 100Z" fill="#745748"/>
<path d="M16 79L263 56" stroke="#d1a77b" stroke-width="5" opacity=".72"/>
<path d="M35 110L259 89L260 108L38 132Z" fill="#594538"/>
<path d="M34 110L258 90" stroke="#b38964" stroke-width="4" opacity=".65"/>
<path d="M52 123L40 227" stroke="#2b2931" stroke-width="15"/>
<path d="M242 107L261 218" stroke="#282a33" stroke-width="15"/>
<path d="M14 103L270 81" stroke="#342c2e" stroke-width="10"/>
<path d="M40 133L263 110" stroke="#382d2d" stroke-width="8"/>
</g>
<!-- Blue leather case standing against bench -->
<g transform="translate(255 515) rotate(-5)">
<ellipse cx="47" cy="165" rx="78" ry="18" fill="#111827" opacity=".6"/>
<rect x="-7" y="20" width="112" height="145" rx="13" fill="url(#case)" stroke="#0d2336" stroke-width="5"/>
<rect x="3" y="29" width="92" height="125" rx="8" fill="none" stroke="#6e8c9a" stroke-opacity=".42" stroke-width="3"/>
<path d="M23 22V7Q23 -4 35 -4H64Q76 -4 76 7V22" fill="none" stroke="#c7a681" stroke-width="8"/>
<path d="M9 66H98M9 130H98" stroke="#c6a06e" stroke-width="7" opacity=".82"/>
<path d="M17 32V154M84 32V154" stroke="#112b43" stroke-width="5" opacity=".6"/>
<rect x="43" y="79" width="22" height="24" rx="4" fill="#c7a47d" stroke="#665441" stroke-width="2"/>
<circle cx="11" cy="161" r="5" fill="#171a23"/><circle cx="91" cy="161" r="5" fill="#171a23"/>
</g>
<!-- Long fog drifting through vanishing point -->
<path d="M0 370Q220 333 450 377T850 372T1200 352V595Q980 550 720 564T0 565Z" fill="url(#fog)" filter="url(#mist)"/>
<ellipse cx="761" cy="452" rx="350" ry="56" fill="#d2b9ac" opacity=".19" filter="url(#mist)"/>
<path d="M0 741Q130 705 315 729T670 724T1200 709V800H0Z" fill="#ad9294" opacity=".12" filter="url(#mist)"/>
<rect width="1200" height="800" fill="url(#vignette)"/>
<rect width="1200" height="800" filter="url(#grain)" opacity=".08"/>
</svg>