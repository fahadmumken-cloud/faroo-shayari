<!-- Canopy receding to a vanishing point -->
<path d="M0 0H1012L669 380L0 338Z" fill="#121d30"/>
<path d="M0 35L965 29L673 369L0 304Z" fill="#263248"/>
<path d="M0 86L915 72L681 364L0 288Z" fill="#141e30" opacity=".88"/>
<path d="M0 290L679 370" stroke="#8e7d72" stroke-width="8" opacity=".45"/>
<path d="M140 0L492 342M365 0L575 352M590 0L638 360M802 0L667 368" stroke="#9a8b80" stroke-width="12" opacity=".24"/>
<!-- Pillars and atmospheric shadows -->
<path d="M91 292L123 297L123 610L89 626Z" fill="#182438"/>
<path d="M102 298L109 299L109 620L102 623Z" fill="#738094" opacity=".3"/>
<path d="M425 342L443 345L443 510L423 514Z" fill="#1d293a"/>
<path d="M558 358L570 360L570 477L558 480Z" fill="#1d293a"/>
<path d="M618 370L626 372L626 466L618 467Z" fill="#263145"/>
