<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Original FAROO 30 October cover: an empty foggy vintage railway platform at dawn, a cobalt blue suitcase by a wooden bench, departing train and amber lamps">
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#101c32"/><stop offset=".36" stop-color="#35435b"/><stop offset=".69" stop-color="#8c8c92"/><stop offset="1" stop-color="#d9ac95"/></linearGradient>
 <linearGradient id="platform" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#353b4c"/><stop offset=".56" stop-color="#515365"/><stop offset="1" stop-color="#1b2637"/></linearGradient>
 <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#b5aaa0"/><stop offset=".5" stop-color="#3b4251"/><stop offset="1" stop-color="#ddd0ba"/></linearGradient>
 <linearGradient id="case" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#244d6a"/><stop offset=".48" stop-color="#183f5b"/><stop offset="1" stop-color="#0b263e"/></linearGradient>
 <linearGradient id="train" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#536071"/><stop offset=".42" stop-color="#2d3a4b"/><stop offset="1" stop-color="#182335"/></linearGradient>
 <radialGradient id="sun"><stop stop-color="#ffe3af" stop-opacity=".76"/><stop offset=".32" stop-color="#ffca8a" stop-opacity=".34"/><stop offset="1" stop-color="#ffca8a" stop-opacity="0"/></radialGradient>
 <radialGradient id="lamp"><stop stop-color="#fff0b9" stop-opacity=".85"/><stop offset=".25" stop-color="#ffcf80" stop-opacity=".3"/><stop offset="1" stop-color="#ffcf80" stop-opacity="0"/></radialGradient>
 <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d4c6c0" stop-opacity="0"/><stop offset=".4" stop-color="#d7c9c0" stop-opacity=".24"/><stop offset="1" stop-color="#d5c2b6" stop-opacity=".07"/></linearGradient>
 <radialGradient id="vignette"><stop offset=".43" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#030713" stop-opacity=".64"/></radialGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
 <filter id="mist"><feGaussianBlur stdDeviation="32"/></filter>
 <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".34" numOctaves="3" seed="30" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
</defs>
<rect width="1200" height="800" fill="url(#sky)"/>
<ellipse cx="900" cy="384" rx="290" ry="235" fill="url(#sun)"/>
