<path d="M731 486L220 800" stroke="url(#rail)" stroke-width="9"/>
<path d="M755 487L504 800" stroke="url(#rail)" stroke-width="6"/>
<g stroke="#111b2a" stroke-width="11" opacity=".75"><path d="M650 514L815 517"/><path d="M597 539L852 545"/><path d="M534 574L912 584"/><path d="M442 624L997 643"/><path d="M314 696L1116 728"/></g>
