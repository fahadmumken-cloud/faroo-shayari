<path d="M340 264V306" stroke="#0e1726" stroke-width="10"/>
<circle cx="340" cy="325" r="37" fill="#0e1929" stroke="#9a8b7c" stroke-width="5"/>
<circle cx="340" cy="325" r="30" fill="#c3b7a3"/>
<g stroke="#253243" stroke-width="3" stroke-linecap="round"><path d="M340 300V305M340 345V350M316 325H321M359 325H364"/><path d="M340 325L340 310M340 325L355 333" stroke-width="4"/></g>
<circle cx="340" cy="325" r="3" fill="#253243"/>
