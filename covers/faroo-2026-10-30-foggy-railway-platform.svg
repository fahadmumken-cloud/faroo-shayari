<path d="M0 419Q150 393 298 407T570 400T870 412T1200 394V562H0Z" fill="#777482" opacity=".32" filter="url(#blur)"/>
<g opacity=".3" stroke="#1a2636" stroke-width="6"><path d="M0 408H1200"/><path d="M0 432H1200"/></g>
<!-- Departing train receding into the haze -->
<path d="M652 387L1130 356L1187 373L1187 511L659 474Z" fill="url(#train)" opacity=".86"/>
<path d="M654 397L1130 366L1167 378L1167 402L654 421Z" fill="#c7b6a0" opacity=".23"/>
<path d="M682 405L730 402L730 433L682 434Z M746 400L803 395L803 433L746 432Z M823 391L886 386L886 431L823 430Z M907 384L977 379L977 429L907 428Z M997 377L1074 371L1074 425L997 427Z" fill="#d8ad74" opacity=".43"/>
