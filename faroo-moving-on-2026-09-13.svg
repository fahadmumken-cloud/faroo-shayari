<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Moving On - FAROO - 13 Sep 2026</title>
<desc id="desc">A cinematic late-night railway platform with a solitary traveler watching a train fade into blue mist.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#07111f"/>
    <stop offset="0.55" stop-color="#17324a"/>
    <stop offset="1" stop-color="#738796"/>
  </linearGradient>
  <linearGradient id="mist" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#d9e5ea" stop-opacity="0.08"/>
    <stop offset="0.6" stop-color="#d9e5ea" stop-opacity="0.42"/>
    <stop offset="1" stop-color="#eef6f8" stop-opacity="0.72"/>
  </linearGradient>
  <linearGradient id="platform" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#26313a"/>
    <stop offset="1" stop-color="#0d1116"/>
  </linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
